[project]
name = "vbridge-dyn"
version = "0.1.0.dev0"
description = "Pre+Post processor for Midas Civil 2022 + RM Bridge — Dynamic analysis automation for high-speed railway bridges following TCVN 13594"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Vu", email = "quangvu0515@gmail.com" },
]
keywords = ["midas-civil", "rm-bridge", "railway-bridge", "dynamic-analysis", "tcvn-13594", "eurocode", "hslm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Natural Language :: Vietnamese",
]

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyarrow>=16.0",
    "matplotlib>=3.8",
    "reportlab>=4.2",
    "jinja2>=3.1",
    "loguru>=0.7",
    "h5py>=3.11",
]

[project.optional-dependencies]
ui = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
]
sections = [
    "sectionproperties>=3.2",
    "shapely>=2.0",
    "chardet>=5.2",
]
dev = [
    "pytest>=8.2",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[project.scripts]
vbdyn = "vbridge_dyn.cli.main:app"

[project.urls]
Repository = "https://github.com/PhamVu1505/vbridge-dyn"
Issues = "https://github.com/PhamVu1505/vbridge-dyn/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vbridge_dyn"]

# ----------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "N",                # pep8-naming
    "RUF",              # ruff-specific
    "SIM",              # simplify
    "TID",              # tidy imports
]
ignore = [
    "E501",             # line too long (already constrained by formatter)
    "RUF001",           # ambiguous Unicode (×, ≡, ≥, ≤, °) — intentional cho ký hiệu khoa học
    "RUF002",           # docstring ambiguous Unicode — intentional tiếng Việt + ký hiệu
    "RUF003",           # comment ambiguous Unicode — intentional tiếng Việt + ký hiệu
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "N802"]
# Typer idiom: typer.Argument/Option phải gọi trong defaults
"src/vbridge_dyn/cli/**" = ["B008"]
# Physics notation: alpha_T (giãn nở nhiệt), Asy/Asz, Iy/Iz, etc.
"src/vbridge_dyn/core/schemas/properties.py" = ["N815"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
markers = [
    "slow: chậm (skip mặc định, dùng --runslow để bật)",
    "midas: cần Midas Civil (skip trên CI thường, chạy weekly)",
    "rm_bridge: cần RM Bridge (Phase 2)",
    "v01_v07: hard benchmarks, chạy mỗi PR",
    "v03_v05_v09: reference comparisons, weekly/on-demand",
]
